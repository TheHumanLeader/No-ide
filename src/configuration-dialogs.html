<template v-if="modal==='configV4'">
  <span class="modal-kicker">RUN CONFIGURATION</span><h2>{{form.id?'编辑':'添加'}}运行配置</h2><p class="modal-subtitle">已选好项目，接下来选入口、选环境即可。命令由工作台生成。</p>
  <div class="launch-location"><span>项目目录</span><code>{{project.root}}</code><button class="text-button" :disabled="busy>0" @click="browseScan">选择模块目录</button></div>
  <div class="launch-scan-state"><strong>{{scanning?'正在查找可运行入口…':'找到 '+(discovery?.entries?.length||0)+' 个入口'}}</strong><div><button class="text-button" :disabled="busy>0" @click="act(scanEntries)">重新扫描</button><button class="text-button" :disabled="busy>0" @click="chooseEntryFile">选择入口文件</button></div></div>
  <label class="entry-picker">运行入口<select :value="selectedEntry" @change="applyEntry($event.target.value)" aria-label="自动运行入口"><option :value="-1">{{form.id?'保留当前入口：'+form.launcher?.target:'请选择扫描发现的入口'}}</option><option v-for="(e,n) in discovery?.entries||[]" :key="n" :value="n">{{e.name}} · {{e.cwd==='.'?'项目根目录':e.cwd}}</option></select></label>
  <p v-if="discovery?.warnings.length" class="discovery-warning">{{discovery.warnings.join('；')}}</p>
  <div v-if="!scanning&&!discovery?.entries?.length&&!form.launcher" class="launch-empty">没有识别到常见入口。可以选择更小的模块目录，或直接选择 .java / .jar / .js / .py 文件。<button class="text-button" @click="advancedConfig">高级自定义配置</button></div>
  <template v-if="form.launcher">
    <div class="form-columns"><label>配置名称<input v-model="form.name" aria-label="配置名称" maxlength="100"></label><label>运行环境<div class="sdk-select-line"><select v-model="form.environment_id" aria-label="配置运行环境"><option value="">使用 {{kindLabel(currentKind)}} 默认环境</option><option v-for="e in matchingEnvs" :key="e.id" :value="e.id">{{e.name}} · {{e.version}}</option></select><button type="button" class="text-button" @click="modal='';page='environments'">管理</button></div></label></div>
    <p v-if="!matchingEnvs.length" class="discovery-warning">没有可用的 {{kindLabel(currentKind)}} 环境。<button class="text-button" :disabled="busy>0" @click="act(()=>ensureKind(currentKind))">自动检测环境</button>，或前往“运行环境”选择安装目录。</p>
    <label>{{buildKind==='maven'?'入口模块目录（含 pom.xml）':'工作目录'}}<div class="live-input-action"><input :value="form.cwd==='.'?'项目根目录':form.cwd" readonly aria-label="配置工作目录"><q-btn class="app-btn secondary" :disable="busy>0" @click="chooseWorkingDir">选择目录</q-btn></div></label>
    <div v-if="buildKind" class="config-build-tool"><label>{{buildKind==='maven'?'Maven':'Gradle'}} 构建工具<div class="live-input-action"><input :value="form.launcher.build_tool_path||'自动：项目包装器 → 全局设置 → 本机检测'" readonly aria-label="配置构建工具"><q-btn class="app-btn secondary" @click="pickConfigBuildTool" :disable="busy>0">选择安装目录</q-btn></div></label><button v-if="form.launcher.build_tool_path" class="text-button" @click="form.launcher.build_tool_path='';commandPreview=null">恢复自动</button><p class="live-help">Maven 与 JDK 分别配置。可选 Maven 安装目录，也可选已有 IDEA 安装目录。</p><button class="text-button" @click="previewCommand" :disabled="busy>0">检查启动条件</button><p v-if="commandPreview" class="launch-check-success">已找到程序：{{commandPreview.command.program}}</p></div>
    <section v-if="buildKind==='maven'" class="config-build-tool maven-workspace-options">
      <strong>本地源码与依赖模块</strong>
      <p class="live-help">自动查找聚合 POM，先构建入口及其同工程依赖，再只启动入口。停止后首次启动和“重新构建”会清理旧产物；普通文件修改走增量构建，删除文件时重新清理。</p>
      <label>Maven 聚合目录<div class="live-input-action"><input :value="form.launcher.maven_root||'自动：向上查找声明了当前模块的聚合 POM'" readonly aria-label="Maven 聚合目录"><q-btn class="app-btn secondary" @click="pickLauncherDirectory('maven_root')">选择聚合目录</q-btn></div></label>
      <button v-if="form.launcher.maven_root" class="text-button" @click="form.launcher.maven_root='';commandPreview=null">自动识别聚合目录</button>
      <label>应用工作目录<div class="live-input-action"><input :value="form.launcher.working_directory||'自动：聚合根目录；单模块时使用模块目录'" readonly aria-label="应用工作目录"><q-btn class="app-btn secondary" @click="pickLauncherDirectory('working_directory')">选择应用目录</q-btn></div></label>
      <button v-if="form.launcher.working_directory" class="text-button" @click="form.launcher.working_directory='';commandPreview=null">恢复自动工作目录</button>
      <p class="live-help">应用工作目录影响 ./config、./data 等相对位置，可与 IDEA 保持一致。不会自动复制或删除这些目录。构建的 install 只更新所选本地 Maven 仓库，不是提交代码或发布服务器。</p>
      <details><summary>构建环境（与 Spring Profile 分开）</summary><value-rows v-model="form.mavenProfileRows" label="Maven Profile" placeholder="例如 local-build"></value-rows><value-rows v-model="form.mavenPropertyRows" label="Maven 属性" pair placeholder="同时用于构建和启动"></value-rows></details>
      <button class="text-button" @click="previewCommand">查看构建范围与启动目录</button>
      <div v-if="commandPreview?.maven" class="explain-box" data-testid="maven-plan"><p>聚合根：{{commandPreview.maven.root}} · 入口：{{commandPreview.maven.module}}</p><p>应用目录：{{commandPreview.cwd}}</p><p>范围：{{commandPreview.maven.multi_module?'入口 + Maven 判定的依赖模块':'单模块'}}</p><p v-if="commandPreview.maven.warnings.length">{{commandPreview.maven.warnings.join('；')}}</p></div>
    </section>
    <div v-if="commandError" class="launch-check-error" role="alert">{{commandError}}</div>
    <p v-if="form.id" class="live-help">正在编辑已有配置，保存会影响复用它的实例，不会创建另一份配置。当前版本保存前需先停止本项目的运行实例。</p>
    <div class="launch-option-grid"><value-rows v-model="form.argumentRows" label="程序入参" placeholder="例如 --server.port={port}"></value-rows><value-rows v-model="form.envRows" label="环境变量" pair></value-rows></div>
    <details class="visual-advanced"><summary>{{currentKind==='java'?'JVM 参数、系统属性与启动配置':'运行时选项与自动更新'}}</summary><value-rows v-model="form.vmRows" :label="currentKind==='java'?'JVM 参数':currentKind==='node'?'Node 选项':'Python 选项'" :placeholder="currentKind==='java'?'-Xmx512m':'运行时选项'"></value-rows><value-rows v-if="currentKind==='java'" v-model="form.propertyRows" label="系统属性" pair placeholder="自动生成 -D名称=值"></value-rows><value-rows v-if="form.launcher.kind==='spring-maven'" v-model="form.profileRows" label="Spring Profile" placeholder="例如 dev"></value-rows><label v-if="currentKind==='java'" class="live-checkbox"><input type="checkbox" v-model="form.launcher.trace_classes" aria-label="类加载来源诊断">类加载来源诊断（仅排查时开启，增加日志量）</label><label>日志编码<select v-model="form.output_encoding" aria-label="日志编码"><option value="auto">自动（UTF-8 / 系统编码）</option><option value="utf-8">UTF-8</option><option value="gbk">GBK / CP936</option><option value="gb18030">GB18030</option><option value="system">系统默认编码</option></select></label><p class="live-help">仅调整构建和运行日志的显示，不修改源码、JVM 文件编码或系统设置。旧配置默认自动；特殊程序日志乱码时可改选。</p><value-rows v-model="form.watchRows" label="监听路径" placeholder="项目内相对路径；留空使用程序自身 HMR / reload"></value-rows><p class="live-help">每一行参数是一个完整值，空格不会被拆开。普通变量保存在本机配置；选择环境后 JAVA_HOME / PATH 由所选环境管理。</p></details>
    <details class="command-preview" @toggle="$event.target.open && previewCommand()"><summary>查看自动生成的运行命令</summary><p>只预览，不执行。端口占位在启动实例时替换。</p><pre v-if="commandPreview">{{commandPreview.command.program}}<template v-for="(arg,n) in commandPreview.command.args" :key="n">\n  {{JSON.stringify(arg)}}</template></pre><p v-else-if="!commandError">尚未解析或正在检查…</p><p v-if="commandPreview">应用目录：{{commandPreview.cwd}}</p><p v-if="commandPreview?.build">构建命令</p><pre v-if="commandPreview?.build">{{commandPreview.build.program}} {{commandPreview.build.args.map(a=>JSON.stringify(a)).join(' ')}}</pre><p v-if="commandPreview?.java_home">构建 Java：{{commandPreview.java_home}}</p></details>
  </template>
  <div class="modal-actions launch-footer"><button class="text-button muted" @click="advancedConfig">高级自定义</button><q-btn class="app-btn secondary" @click="modal=''">取消</q-btn><q-btn class="app-btn primary" :disable="busy>0||!form.launcher||!matchingEnvs.length" @click="saveVisualConfig">保存配置</q-btn></div>
</template>
<template v-else-if="modal==='environment'"><span class="modal-kicker">RUNTIME LIBRARY</span><h2>{{envDraft.id?'编辑':'添加'}}运行环境</h2><p class="modal-subtitle">选安装目录即可，也可以直接选运行程序。名称和版本会自动识别。</p><label>环境类型<select v-model="envDraft.kind" :disabled="!!envDraft.id" aria-label="环境类型"><option value="java">Java / JDK</option><option value="node">Node.js</option><option value="python">Python / 虚拟环境</option></select></label><label>安装位置<div class="live-input-action"><input :value="envDraft.path" readonly placeholder="选择 JDK、Node 或 Python 安装目录" aria-label="环境安装路径"><q-btn class="app-btn secondary" :disable="busy>0" @click="pickEnvironment('folder')">选择目录</q-btn></div></label><button class="text-button" :disabled="busy>0" @click="pickEnvironment('file')">改为选择可执行程序</button><label class="env-alias">显示名称 <small>可选，留空自动识别</small><input v-model="envDraft.name" placeholder="例如 Java 8 · 老项目 / Java 17" aria-label="环境名称"></label><label class="live-checkbox"><input type="checkbox" v-model="envDraft.default">作为这一类环境的默认选择</label><p class="live-help">添加不会安装、升级或删除软件。自动运行版本检测；Python 虚拟环境会保留自己的路径，不替换成系统 Python。</p><div class="modal-actions"><q-btn class="app-btn secondary" @click="modal=''">取消</q-btn><q-btn class="app-btn primary" :disable="busy>0||!envDraft.path" @click="saveEnvironment">验证并保存环境</q-btn></div></template>
<template v-else-if="modal==='removeEnvironment'"><h2>移除环境登记？</h2><p class="modal-subtitle">{{envDraft.name}} · {{envDraft.version}}</p><div class="explain-box">不会删除程序安装文件。仍被运行配置或实例引用的环境不能移除。</div><div class="modal-actions"><q-btn class="app-btn secondary" @click="modal=''">取消</q-btn><q-btn class="app-btn primary" :disable="busy>0" @click="confirmRemoveEnvironment">确认移除</q-btn></div></template>
<template v-else-if="modal==='instance'"><span class="modal-kicker">RUN INSTANCE</span><h2>{{form.id?'修改':'添加'}}运行实例</h2><p class="modal-subtitle">复用已有配置；需要不同环境或参数时，在这里单独覆盖。</p><label>实例名称<input v-model="form.name" aria-label="实例名称"></label><div class="form-columns"><label>运行配置<select v-model="form.config_id" @change="form.environment_id=''" aria-label="实例运行配置"><option v-for="c in project.configs" :key="c.id" :value="c.id">{{c.name}}</option></select></label><label>运行环境<select v-model="form.environment_id" :disabled="!instanceKind" aria-label="实例运行环境"><option value="">继承运行配置的环境</option><option v-for="e in instanceEnvs" :key="e.id" :value="e.id">{{e.name}} · {{e.version}}</option></select></label></div><label>实例端口 <small>非服务程序可留空</small><input type="number" min="1" max="65535" v-model="form.port" aria-label="实例端口" placeholder="使用程序的实际监听端口"></label><value-rows v-model="form.argumentRows" label="附加入参"></value-rows><value-rows v-model="form.envRows" label="实例环境变量" pair></value-rows><p class="live-help">环境覆盖只影响本实例运行。Java 的共享编译使用配置所选 JDK；较低版本的 Java 可能不能运行较新 JDK 编译的类。端口通过 {port} 与 PORT 传入程序。</p><div class="modal-actions"><q-btn class="app-btn secondary" @click="modal=''">取消</q-btn><q-btn class="app-btn primary" :disable="busy>0" @click="saveVisualInstance">保存实例</q-btn></div></template>
<template v-else-if="modal==='changeGroup'"><span class="modal-kicker">LOCAL CHANGELIST</span><h2>{{groupDraft.id?'重命名分组':'新建分组'}}</h2><p class="modal-subtitle">分组与文件归属保存在本机，Git 与 SVN 使用相同操作。</p><label>分组名称<input v-model="groupDraft.name" aria-label="分组名称" placeholder="例如：忽略不提交" maxlength="120" @keydown.enter="saveGroup"></label><div class="explain-box">文件移入分组后，刷新、重启、提交以及文件暂时没有变更，都不会忘记归属。这里不修改 .gitignore，也不移动磁盘文件。</div><div class="modal-actions"><q-btn class="app-btn secondary" @click="modal=''">取消</q-btn><q-btn class="app-btn primary" :disable="busy>0||!groupDraft.name.trim()" @click="saveGroup">保存分组</q-btn></div></template>
<template v-else-if="modal==='deleteGroup'"><h2>删除“{{groupDraft.name}}”？</h2><p class="modal-subtitle">属于此组的文件将回到“默认”，包括目前没有改动的已记忆文件。</p><div class="explain-box">不会删除源文件、改动仓库或丢弃代码。</div><div class="modal-actions"><q-btn class="app-btn secondary" @click="modal=''">取消</q-btn><q-btn class="app-btn primary" :disable="busy>0" @click="confirmDeleteGroup">删除分组，移回默认</q-btn></div></template>
