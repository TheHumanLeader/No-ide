[package]
name = "no-ide"
version = "0.3.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "signal", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
dirs = "6"
fs2 = "0.4"
tempfile = "3"
tower-http = { version = "0.6", features = ["fs"] }
process-wrap = { version = "10", features = ["tokio1"] }
notify = "8"
rfd = "0.17"
roxmltree = "0.20"
open = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
