name: Native executor
on:
  push:
    branches: [main, 'backend/rust-v0.3', 'feature/easy-run-v0.4', 'feature/hotswap-v0.5']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: source.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check && npm test && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: native-web
          path: dist/
  native:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
          - os: windows-2022
            label: windows-x64
          - os: macos-14
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.label == 'macos-arm64' && 'zulu' || 'temurin' }}
          java-version: '8'
      - name: Remember Java 8 SDK
        run: echo "TEST_JAVA8=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Remember Java 17 SDK
        run: echo "TEST_JAVA17=$JAVA_HOME" >> "$GITHUB_ENV"
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ runner.os == 'Linux' && 'ubuntu-22.04' || '' }}
          cache-on-failure: true
      - name: Linux build dependencies and SVN test client
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libwayland-dev subversion fonts-noto-cjk
      - name: macOS SVN test client
        if: runner.os == 'macOS'
        run: brew list subversion >/dev/null 2>&1 || brew install subversion
      - name: Windows SVN test client
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install sliksvn -y --no-progress
      - name: Build Java 8 compatible HotSwap agent
        run: |
          mvn -B -ntp -f agent/pom.xml -DskipTests package
          python -c "from pathlib import Path; import os; f=open(os.environ['GITHUB_ENV'],'a'); f.write('NO_IDE_AGENT='+str(Path('agent/target/no-ide-agent.jar').resolve())+'\n')"
      - run: cargo test --manifest-path backend/Cargo.toml --all-targets
      - run: cargo build --manifest-path backend/Cargo.toml --release
      - uses: actions/download-artifact@v4
        with:
          name: native-web
          path: dist
      - name: Real API and process integration tests
        run: python tests/backend-smoke.py
      - name: Runtime registry and changelist integration tests
        run: python tests/workbench-v04.py
      - name: Repository metadata grouping regression
        run: python tests/metadata_groups.py
      - name: Browser dependencies
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real v0.4 UI and backend browser test
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: python tests/browser-v04.py
      - name: SVN .git grouping browser regression
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: python tests/metadata_groups.py --browser
      - name: Real 150-file grouping and Maven startup regressions
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: python tests/fix-041.py
      - name: Actual Maven reactor stale-JAR and WebSocket regression
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: python tests/maven-reactor-043.py
      - name: Actual incremental module reuse and deleted source regression
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: python tests/maven-incremental-044.py
      - name: Actual HotSwap same JVM, state and WebSocket regression
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: python tests/hotswap-050.py
      - name: Log follow through actual stdout and WebSocket
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: python tests/log-scroll.py
      - name: Non-UTF-8 build and Chinese path regressions
        run: python tests/encoding-042.py
      - name: Format and archive native source with dependency lock
        if: always()
        run: |
          cargo fmt --manifest-path backend/Cargo.toml
          python -c "from pathlib import Path; import zipfile; r=Path('backend'); z=zipfile.ZipFile('native-source.zip','w',zipfile.ZIP_DEFLATED); [z.write(p) for p in [r/'Cargo.toml',r/'Cargo.lock',*r.glob('src/**/*.rs')] if p.is_file()]; z.close()"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: formatted-native-source
          path: native-source.zip
      - name: Package executable and local web app
        run: python scripts/package-native.py '${{ matrix.label }}'
      - uses: actions/upload-artifact@v4
        with:
          name: no-ide-${{ matrix.label }}
          path: packages/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-report-${{ matrix.label }}
          path: |
            test-results/native-*.json
            test-results/native-*.png
            test-results/native-*.log
          if-no-files-found: ignore
