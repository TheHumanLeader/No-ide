name: Native executor
on:
  push:
    branches: [main, 'backend/rust-v0.3']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          test ! -f backend/Cargo.toml || echo 'backend=true' >> "$GITHUB_OUTPUT"
          git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: source.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check && npm test && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: native-web
          path: dist/
  native:
    needs: web
    if: needs.web.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64
          - os: windows-2022
            label: windows-x64
          - os: macos-14
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo test --manifest-path backend/Cargo.toml --all-targets
      - run: cargo build --manifest-path backend/Cargo.toml --release
      - uses: actions/download-artifact@v4
        with:
          name: native-web
          path: dist
      - name: Real API and process smoke test
        run: python tests/backend-smoke.py
      - name: Package executable and local web app
        run: python scripts/package-native.py '${{ matrix.label }}'
      - uses: actions/upload-artifact@v4
        with:
          name: no-ide-${{ matrix.label }}
          path: packages/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-report-${{ matrix.label }}
          path: test-results/native-*.json
          if-no-files-found: ignore
